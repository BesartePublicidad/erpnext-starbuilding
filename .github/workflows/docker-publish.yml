name: Build & Publish Custom ERPNext Image

on:
  push:
    branches: [ "main" ]
    tags:    [ "v*.*.*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ------------------------------------------------------------------
      # 0a. Liberar ~15GB de disco eliminando software preinstalado
      #     innecesario en el runner. ERPNext build consume ~13-14GB:
      #     frappe/build image (~4GB) + bench+apps (~5GB) + imagen final (~4GB).
      #     Sin esto: "No space left on device" al exportar la imagen.
      # ------------------------------------------------------------------
      - name: Free disk space (~15GB) before build
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false      # conservar herramientas de CI (node, python, etc.)
          android: true          # libera ~9GB
          dotnet: true           # libera ~2GB
          haskell: true          # libera ~5GB
          large-packages: false  # no tocar paquetes de sistema (apt)
          docker-images: true    # libera imágenes Docker pre-cacheadas
          swap-storage: false    # lo manejamos nosotros en el siguiente step

      # ------------------------------------------------------------------
      # 0b. Swap: Expandir a 10GB para prevenir OOM (exit 167).
      #     Usamos la action oficial que maneja el /swapfile pre-existente
      #     en runners Ubuntu de GitHub (fallocate falla si ya está en uso).
      # ------------------------------------------------------------------
      - name: Expand swap to 10GB to prevent OOM (exit 167)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      # ------------------------------------------------------------------
      # 1. Checkout del repositorio
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Configurar QEMU y Buildx
      #    QEMU habilita emulación multi-plataforma (preparado para arm64)
      # ------------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------
      # 3. Login a GHCR
      #    REQUISITO: Settings > Actions > General > "Read and write permissions"
      # ------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 4. Extraer metadata para tags y labels automáticos
      # ------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=version-16,enable={{is_default_branch}}

      # ------------------------------------------------------------------
      # 5. Codificar apps.json en Base64
      #    El Dockerfile lo decodifica vía ARG APPS_JSON_BASE64.
      #    apps.json está en la raíz del repo (mismo nivel que Dockerfile).
      # ------------------------------------------------------------------
      - name: Encode apps.json to Base64
        id: apps_json
        run: |
          APPS_JSON_BASE64=$(base64 -w 0 apps.json)
          echo "APPS_JSON_BASE64=${APPS_JSON_BASE64}" >> $GITHUB_OUTPUT
          echo "--- apps.json incluido en el build ---"
          cat apps.json
          echo "--- Espacio en disco disponible ---"
          df -h

      # ------------------------------------------------------------------
      # 6. Build y Push a GHCR
      #    - context: . (raíz del repo, donde están Dockerfile y apps.json)
      #    - SIN cache GHA: el build de ERPNext llena el disco de 14GB;
      #      la cache duplica el uso temporal de espacio innecesariamente.
      #    - NODE_OPTIONS limita heap de Node a 4GB (de los 10GB de swap)
      #    - Solo amd64 en runner gratuito (arm64 requiere self-hosted)
      # ------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            APPS_JSON_BASE64=${{ steps.apps_json.outputs.APPS_JSON_BASE64 }}
          platforms: linux/amd64
