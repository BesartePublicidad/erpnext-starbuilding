name: Build & Publish Custom ERPNext Image

on:
  push:
    branches: [ "main" ]
    tags:    [ "v*.*.*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ------------------------------------------------------------------
      # 0. Swap: Expandir a 10GB para prevenir OOM (exit 167).
      #    Usamos la action oficial que maneja correctamente el /swapfile
      #    pre-existente en runners Ubuntu de GitHub (fallocate falla si
      #    el archivo ya está en uso).
      # ------------------------------------------------------------------
      - name: Expand swap to 10GB to prevent OOM (exit 167)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      # ------------------------------------------------------------------
      # 1. Checkout del repositorio
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Configurar Docker Buildx
      # ------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------
      # 3. Login a GHCR
      #    REQUISITO: Settings > Actions > General > "Read and write permissions"
      # ------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 4. Extraer metadata para tags y labels automáticos
      # ------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value=version-16,enable={{is_default_branch}}

      # ------------------------------------------------------------------
      # 5. Codificar apps.json en Base64
      #    El Dockerfile lo decodifica vía ARG APPS_JSON_BASE64.
      #    apps.json está en la raíz del repo (mismo nivel que Dockerfile).
      # ------------------------------------------------------------------
      - name: Encode apps.json to Base64
        id: apps_json
        run: |
          APPS_JSON_BASE64=$(base64 -w 0 apps.json)
          echo "APPS_JSON_BASE64=${APPS_JSON_BASE64}" >> $GITHUB_OUTPUT
          echo "--- apps.json que se incluirá en el build ---"
          cat apps.json

      # ------------------------------------------------------------------
      # 6. Build y Push a GHCR
      #    - context: . (raíz del repo, donde están Dockerfile y apps.json)
      #    - cache GHA para acelerar rebuilds
      #    - NODE_OPTIONS limita heap de Node a 4GB
      # ------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            APPS_JSON_BASE64=${{ steps.apps_json.outputs.APPS_JSON_BASE64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
